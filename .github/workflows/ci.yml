name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }} / py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      # --locked (not --frozen): fails when pyproject.toml and uv.lock drift,
      # so CI never votes on a dependency state the project no longer declares.
      - name: Sync dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  lint:
    name: lint / ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --locked --extra dev --python 3.13

      - name: Ruff
        run: uv run --python 3.13 ruff check .

  package:
    name: package / build-and-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke installed wheel in clean environment
        shell: bash
        run: |
          set -euo pipefail
          wheel_count="$(find dist -maxdepth 1 -name '*.whl' | wc -l)"
          echo "wheels built: $wheel_count"
          test "$wheel_count" = 1
          sdist_count="$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)"
          echo "sdists built: $sdist_count"
          test "$sdist_count" = 1
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv venv --python 3.13 .pkg-smoke
          uv pip install --python .pkg-smoke/bin/python "$wheel"
          relay_bin="$(pwd)/.pkg-smoke/bin/relay"
          "$relay_bin" --help
          # Exercise the INSTALLED wheel outside the checkout: workspace
          # discovery, relay.yaml defaults, SQLite migration/render paths.
          # Offline by design; no provider credentials exist or are needed.
          smoke_dir="$(mktemp -d)"
          (
            cd "$smoke_dir"
            "$relay_bin" init
            "$relay_bin" status
          )

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  required:
    name: required
    if: always()
    needs: [test, lint, package]
    runs-on: ubuntu-latest
    steps:
      - name: Verify authoritative gates
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          printf 'test=%s\nlint=%s\npackage=%s\n' "$TEST_RESULT" "$LINT_RESULT" "$PACKAGE_RESULT"
          test "$TEST_RESULT" = success
          test "$LINT_RESULT" = success
          test "$PACKAGE_RESULT" = success
