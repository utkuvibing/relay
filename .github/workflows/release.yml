name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen --python 3.13

      - name: Run tests
        run: uv run --python 3.13 pytest

      - name: Ruff
        run: uv run --python 3.13 ruff check .

      - name: Build distributions
        run: uv build

      - name: Smoke installed wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python 3.13 .release-smoke
          uv pip install --python .release-smoke/bin/python "$wheel"
          .release-smoke/bin/relay --help

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: relay-release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: relay-release-dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
