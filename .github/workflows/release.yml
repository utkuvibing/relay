name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # Full history is REQUIRED for the lineage gate below; a shallow clone
      # of just the tagged commit could make merge-base report false negatives.
      - name: Checkout (complete history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Release-lineage gate (the authoritative guarantee): a tagged commit
      # that is not reachable from protected origin/main must NEVER publish.
      # Fails closed on ambiguity. Tag pushes only — manual dispatch keeps
      # its historical non-publishing smoke semantics.
      - name: Verify release lineage (tagged commit must be reachable from main)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::refs/remotes/origin/main unavailable after full checkout"
            exit 1
          fi
          main_tip="$(git rev-parse refs/remotes/origin/main)"
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if git merge-base --is-ancestor "$tag_commit" "$main_tip"; then
            echo "lineage ok: $tag_commit ($(git log -1 --format='%h %s' "$tag_commit"))" \
                 "is reachable from origin/main ($main_tip)"
          else
            echo "::error::refusing release — tagged commit $tag_commit" \
                 "is NOT reachable from origin/main $main_tip"
            exit 1
          fi

      # vX.Y.Z must equal [project].version exactly; tomllib (stdlib) parses
      # the real TOML — no regex/sed fragility. Runs before any publication.
      - name: Enforce tag/package version equality
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 - <<'EOF'
          import os, sys, tomllib

          tag = os.environ["TAG"]
          expected = tag.removeprefix("v")
          if not expected or expected == tag:
              sys.exit(f"unexpected tag {tag!r}: expected format vX.Y.Z")
          parts = expected.split(".")
          if len(parts) != 3 or not all(p.isdigit() for p in parts):
              sys.exit(f"unexpected tag {tag!r}: expected format vX.Y.Z")
          with open("pyproject.toml", "rb") as fh:
              declared = tomllib.load(fh)["project"]["version"]
          if declared != expected:
              sys.exit(f"tag {tag!r} does not match pyproject.toml version {declared!r}")
          print(f"version parity ok: tag {tag} == project {declared}")
          EOF

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python install 3.13

      # --locked enforces pyproject.toml <-> uv.lock consistency at release time.
      - name: Sync dependencies
        run: uv sync --locked --extra dev --python 3.13

      - name: Run tests
        run: uv run --python 3.13 pytest

      - name: Ruff
        run: uv run --python 3.13 ruff check .

      - name: Build distributions
        run: uv build

      - name: Smoke installed wheel in clean environment
        shell: bash
        run: |
          set -euo pipefail
          wheel_count="$(find dist -maxdepth 1 -name '*.whl' | wc -l)"
          echo "wheels built: $wheel_count"
          test "$wheel_count" = 1
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv venv --python 3.13 .release-smoke
          uv pip install --python .release-smoke/bin/python "$wheel"
          relay_bin="$(pwd)/.release-smoke/bin/relay"
          "$relay_bin" --help
          # Offline exercised-installed-package smoke (see CI mirror):
          # discovery, config defaults, SQLite init — outside the checkout.
          smoke_dir="$(mktemp -d)"
          (
            cd "$smoke_dir"
            "$relay_bin" init
            "$relay_bin" status
          )

      - name: Upload release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: relay-release-dist
          path: dist

      # Idempotent convergence: reruns after partial failure must finish the
      # release instead of wedging on already_exists; assets clobber-refreshed.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — converging"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" dist/* --clobber
