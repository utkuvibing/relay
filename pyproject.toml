[project]
name = "relay"
version = "0.1.0"
description = "Local-first orchestration runtime coordinating AI models, coding agents, tools, and humans."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Utku ŞAHİN" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn>=0.30",
    "websockets>=13.0",
]

[project.scripts]
relay = "relay.cli.main:app"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.168.0",
    "pyright>=1.1.414",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# B008: typer.Option(...) in parameter defaults is Typer's canonical API.
"relay/cli/main.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "invariants: hypothesis property/invariant tests (pre-P6 hardening)",
    "live_claude: live adapter smoke tests (never run in CI)",
]

# Static typing ratchet: strict mode is enforced on the orchestration spine
# (core), the canonical persistence layer (storage), and the harness boundary.
# AllPlatforms keeps platform-gated stdlib symbols resolvable on every CI OS.
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["relay/core", "relay/storage", "relay/harness", "relay/server"]
